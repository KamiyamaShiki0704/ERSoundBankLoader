# ERSoundBankLoader config
# Put this file beside er_sound_bank_loader.dll.

[general]
enabled=true

# Master log output switch.
# true  = write ersoundbank_loader.log beside the DLL
# false = no log file output
log_enabled=true

[runtime]
start_delay_ms=5000
conditional_enabled=false
# Applied independently to every local and remote player in the scene.
condition_hand=auto
poll_every_frames=6
unload_when_inactive=true

[bank_files]
memory_copy_enabled=true

# auto searches nearby sd and mod/sd folders.
# You can also add explicit folders with more bank_file_dir=... lines.
bank_file_dir=auto

[fallback_startup_preload]
# Used only when conditional_enabled=false.
# Add one bank per line, for example:
# sound_bank_id=<chr-sound-bank-id>

retries_per_id=120
retry_every_frames=60

[conditional_bank_mappings]
# sp_atkcategory -> chr Sound Bank id
# Used only when conditional_enabled=true.
# All players in WorldChrMan.player_chr_set are checked, including Seamless Co-op peers.
# Add one mapping per line, for example:
# condition_bank_mapping=<sp_atkcategory>:<chr-sound-bank-id>

# Active SpEffect ID -> chr Sound Bank id
# This can be used alone or together with condition_bank_mapping.
# Add one mapping per line, for example:
# sp_effect_bank_mapping=<SpEffect-ID>:<chr-sound-bank-id>

[conditional_sfx_bank_mappings]
# Native SFX Bank loading is version-checked separately from Sound Bank loading.
sfx_enabled=false
sfx_ready_timeout_ms=10000

# sp_atkcategory -> SFX Resource Bank ID (SfxBnd_c####.ffxbnd)
# Add one mapping per line, for example:
# sfx_condition_bank_mapping=<sp_atkcategory>:<SFX-Resource-Bank-ID>

# Active SpEffect ID -> SFX Resource Bank ID
# This can be used alone or together with sfx_condition_bank_mapping.
# Add one mapping per line, for example:
# sfx_sp_effect_bank_mapping=<SpEffect-ID>:<SFX-Resource-Bank-ID>
