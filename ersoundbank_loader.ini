# ERSoundBankLoader config
# Put this file beside er_sound_bank_loader.dll.

[general]
enabled=true

# Master log output switch.
# true  = write ersoundbank_loader.log beside the DLL
# false = no log file output
log_enabled=true

[runtime]
start_delay_ms=5000
conditional_enabled=true
condition_hand=auto
poll_every_frames=6
unload_when_inactive=true

[bank_files]
memory_copy_enabled=true

# auto searches nearby sd and mod/sd folders.
# You can also add explicit folders with more bank_file_dir=... lines.
bank_file_dir=auto

[fallback_startup_preload]
# Used only when conditional_enabled=false.
sound_bank_id=4205
sound_bank_id=7800
sound_bank_id=8019
sound_bank_id=9495
sound_bank_id=9496

retries_per_id=120
retry_every_frames=60

[fd4_diagnostics]
# Kept for diagnostics; LoadBankMemoryCopy is the confirmed working step.
# Placeholders:
#   {id}  -> decimal id, e.g. 7800
#   {id4} -> zero-padded four-digit id, e.g. 7800 or 0420
path_template=wwise:/{id}.bnk
path_template=wwise:/cs_c{id4}.bnk
path_template=wwise_bnd:/cs_c{id4}.bnk

[conditional_bank_mappings]
# sp_atkcategory -> chr Sound Bank id
condition_bank_mapping=73:7800
condition_bank_mapping=105:8019
condition_bank_mapping=122:4205
condition_bank_mapping=132:9495
condition_bank_mapping=133:9495
condition_bank_mapping=643:9496
