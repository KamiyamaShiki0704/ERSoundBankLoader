[package]
name = "er-sound-bank-loader"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
eldenring = { path = "../../fromsoftware-rs-0.14.0/crates/eldenring" }
fromsoftware-shared = { path = "../../fromsoftware-rs-0.14.0/crates/shared" }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
