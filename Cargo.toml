[package]
name = "er-sound-bank-loader"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
eldenring = "0.14.0"
fromsoftware-shared = "0.14.0"
pelite = "0.10"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
from-singleton = "3.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
