[package]
name = "er-sound-bank-loader"
version = "0.4.2"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
eldenring = { path = "../fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../fromsoftware-rs/crates/shared" }
pelite = "0.10"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
from-singleton = "3.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
