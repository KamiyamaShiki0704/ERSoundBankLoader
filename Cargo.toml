[workspace]
resolver = "2"
members = ["."]

[package]
name = "er-sound-bank-loader"
version = "0.4.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
shikifsrs-elden-ring = { git = "https://github.com/KamiyamaShiki0704/ShikiFSRS.git", rev = "fb9f4524da1fb648e0a696f2d47aa08d3acf35cc" }
shikifsrs-runtime = { git = "https://github.com/KamiyamaShiki0704/ShikiFSRS.git", rev = "fb9f4524da1fb648e0a696f2d47aa08d3acf35cc" }
pelite = "0.10"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }


[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
