[package]
name = "er-sound-bank-loader"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
eldenring = { git = "https://github.com/vswarte/eldenring-rs.git", rev = "902851865d05069eda7dcfd6385c8881eadf29bf" }
fromsoftware-shared = { git = "https://github.com/vswarte/eldenring-rs.git", rev = "902851865d05069eda7dcfd6385c8881eadf29bf" }
pelite = "0.10"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
from-singleton = "3.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
