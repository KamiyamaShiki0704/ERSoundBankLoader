[package]
name = "er-sound-bank-loader"
version = "0.4.2"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
eldenring = { git = "https://github.com/KamiyamaShiki0704/fromsoftware-rs", rev = "dd7b5a1d71169a3d3cbdfc619ecd72be169f17d5" }
fromsoftware-shared = { git = "https://github.com/KamiyamaShiki0704/fromsoftware-rs", rev = "dd7b5a1d71169a3d3cbdfc619ecd72be169f17d5" }
pelite = "0.10"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
from-singleton = "3.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
